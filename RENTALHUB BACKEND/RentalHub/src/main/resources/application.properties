spring.application.name=rentalhub
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/rentalhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Base64 secret, at least 32 bytes. Generate: openssl rand -base64 32
app.jwt.secret=ReplaceThisWithYourOwnBase64SecretGeneratedByOpenSSL=
app.jwt.expiration-ms=86400000

logging.level.com.rentalhub=DEBUG
logging.file.path=logs

# Payments: "mock" (default, no keys needed) or "razorpay"
app.payment.provider=mock
app.payment.currency=INR

# Only needed when provider=razorpay (Razorpay dashboard -> Test mode -> API keys)
app.payment.razorpay.key-id=rzp_test_xxxxxxxx
app.payment.razorpay.key-secret=xxxxxxxxxxxxxxxx